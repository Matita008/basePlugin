project:
  name: basePlugin
  description: "A plugin used as a shared library"

signing:
  pgp:
    active: ALWAYS
    armored: true

deploy:
  maven:
    github:
      baseplugin:
        active: RELEASE
        url: "https://maven.pkg.github.com/Matita008/basePlugin"
    mavenCentral:
      sonatype:
        active: RELEASE
        url: "https://central.sonatype.com/api/v1/publisher"
        applyMavenCentralRules: true
        stagingRepositories:
          - "target/staging-deploy"
